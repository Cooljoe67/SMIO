# SMIO configuration: folder lists and mail accounts.
#
# The deployed service reads this file from GCS (GCS_CONFIG_OBJECT, default
# config/smio.yaml) at the start of every workflow run, so changes apply
# without a redeploy. This copy is what scripts and local runs use, the
# initial upload, and the service's fallback if the GCS copy is invalid when
# it starts.
#
# Never put secrets here. Give a credential as the name of a Google Secret
# Manager secret (password_secret, client_secret_secret, ...), read when the
# account logs in, or use ${ENV_VAR} (or ${ENV_VAR:-default}) to read a value
# from the environment / .env. An account whose ${ENV_VAR}s are not set is
# skipped and reported; the other accounts keep running.

# Each folder list is named after the classifier model trained for it. Its
# keys (plus the implicit "other", which stays in the inbox) are the model's
# labels, so adding or removing a folder means a new list and a new model.
# "enabled: false" keeps the label but leaves those mails in the inbox.
folder_lists:
  default:
    delivery:
      enabled: true
      retention_days: null
      retention_days_unread: 20
    tech:
      enabled: true
      retention_days: 1
      retention_days_unread: 20
    social:
      enabled: true
      retention_days: 5
      retention_days_unread: 20
    commercial:
      enabled: true
      retention_days: 10
      retention_days_unread: 20

  # Logistics folders by what a mail needs; scripts/import_labelled_tsv.py
  # derives them from the labelled dataset (t1a-arbeitsblatt.tsv). Mails needing
  # other action stay in the inbox ("other"). "manual: true" folders are filed
  # by hand only: watched for moves, never predicted, not model labels.
  # Business mail is kept; only read newsletters are deleted after 10 days.
  logistics:
    dringend: {folder: "1: Dringend"}
    zu_beantworten: {folder: "2: Zu beantworten"}
    zur_kenntnis: {folder: "3: Zur Kenntnis"}
    statusmeldung: {folder: "4: Statusmeldung"}
    antwort_ausstehend: {folder: "5: Antwort ausstehend", manual: true}
    abgeschlossen: {folder: "6: Abgeschlossen", manual: true}
    marketing: {folder: "7: Marketing & Newsletter", retention_days: 10}
    transportdokumente: {folder: "8: Transportdokumente"}
    rechnungen: {folder: "9: Rechnungen & Belege"}

# An account id identifies its stored mails: never change it, or the inbox is
# imported again as new mail. The service rejects a GCS copy that drops the id
# of stored mails and keeps its previous config (at startup: this file).
accounts:
  - id: primary
    provider: imap            # imap | gmail | exchange (gmail and exchange: not yet supported)
    email: ${IMAP_USER}
    user_first_name: ${USER_FIRST_NAME:-there}
    folder_list: default
    mailbox:
      inbox: INBOX
      folder_root: INBOX      # classification folders become <folder_root>/<folder>
      trash: Papierkorb
      # sent: Gesendet        # default: the folder the server flags as \Sent
      # drafts: Entwürfe      # reply drafts; default: the folder the server flags as \Drafts
    imap:
      host: ${IMAP_HOST}
      username: ${IMAP_USER}
      # Read from Secret Manager at login. For local runs without Google Cloud
      # use instead:  password: ${IMAP_PASSWORD}
      password_secret: imap-password

  # More IMAP accounts: scripts/add_account.ps1 stores the password as the
  # secret imap-<id>-password and prints the entry to add to the GCS copy.

  # Gmail (OAuth2 client of a Google Cloud project, refresh token per mailbox):
  # - id: gmail-example
  #   provider: gmail
  #   email: someone@gmail.com
  #   folder_list: default
  #   mailbox: {inbox: INBOX, folder_root: smio, trash: "[Gmail]/Trash"}
  #   gmail:
  #     client_id: ${GMAIL_CLIENT_ID}
  #     client_secret_secret: gmail-client-secret
  #     refresh_token_secret: gmail-example-refresh-token

  # Microsoft Exchange Online (Entra ID app registration with Mail.ReadWrite):
  # - id: exchange-example
  #   provider: exchange
  #   email: someone@company.com
  #   folder_list: default
  #   mailbox: {inbox: Inbox, folder_root: Inbox, trash: Deleted Items}
  #   exchange:
  #     tenant_id: ${EXCHANGE_TENANT_ID}
  #     client_id: ${EXCHANGE_CLIENT_ID}
  #     client_secret_secret: exchange-example-client-secret
